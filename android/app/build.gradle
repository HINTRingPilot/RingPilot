plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hintringpilot.ringpilot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hintringpilot.ringpilot'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // 개발용 화면(수집·기록 탭, Hz·누락 샘플). 기본은 숨기고 -PdevTools=true로 빌드하면 보인다
        buildConfigField 'boolean', 'DEV_TOOLS', (project.findProperty('devTools') ?: 'false').toString()
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
